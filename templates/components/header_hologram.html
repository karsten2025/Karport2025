<!-- 🌟 HEADER HOLOGRAM: Profilbild → Torus (Option B: Delayed Init) -->
<figure class="profile-figure has-tooltip">
  <div class="hologram-wrapper">
    <!-- Profilbild: Initial sichtbar (WebP 70KB) -->
    <picture>
      <source srcset="{{ url_for('static', filename='images/karsten-profile.webp') }}" type="image/webp">
      <img
        src="{{ url_for('static', filename='images/karsten-profile.jpg') }}"
        alt="Profilbild von Karsten Zenk"
        class="hologram-img hologram-img-profile"
        id="hologram-profile"
        loading="lazy"
      />
    </picture>
    
    <!-- Torus: Initial unsichtbar (WebP 235KB) -->
    <picture>
      <source srcset="{{ url_for('static', filename='images/roll-torus-logo.webp') }}" type="image/webp">
      <img
        src="{{ url_for('static', filename='images/roll-torus-logo.png') }}"
        alt="The Symbiotic Value Engine"
        class="hologram-img hologram-img-torus"
        id="hologram-torus"
        loading="lazy"
      />
    </picture>
  </div>

  <!-- WhyMe-Bubble -->
  <div id="whyme-bubble" class="whyme-bubble" aria-hidden="true">
    {% if lang == 'de' %}
      {% include 'partials/whyme.de.html' %}
    {% else %}
      {% include 'partials/whyme.en.html' %}
    {% endif %}
  </div>
</figure>

<style>
.profile-figure.has-tooltip {
  display: block !important;
  width: 100% !important;
  max-width: 400px !important;
  margin: 20px auto !important;
}

.hologram-wrapper {
  position: relative !important;
  width: 100% !important;
  height: 400px !important;
  display: block !important;
  z-index: 1 !important;
}

.hologram-img {
  position: absolute !important;
  top: 0 !important;
  left: 0 !important;
  width: 100% !important;
  height: 100% !important;
  display: block !important;
  object-fit: cover !important;
  border-radius: 50% !important;
  object-position: center 20% !important;
}

.hologram-img-profile {
  z-index: 2;
  opacity: 1;
  transform: scale(1);
  transition: opacity 1.2s ease, transform 1.2s ease;
}

.hologram-img-profile.fade-out {
  opacity: 0;
  transform: scale(0.85);
}

.hologram-img-torus {
  z-index: 1;
  opacity: 0;
  transform: scale(0.6);
  mix-blend-mode: screen;
  filter: brightness(1.2);
  transition: opacity 1.5s ease 0.3s, transform 1.5s ease 0.3s;
}

.hologram-img-torus.morph-in {
  opacity: 0.85;
  transform: scale(1);
}

.hologram-img-torus.settled {
  animation: hologramPulse 4s ease-in-out infinite;
}

@keyframes hologramPulse {
  0%, 100% {
    transform: scale(1);
    filter: brightness(1.2);
  }
  50% {
    transform: scale(1.03);
    filter: brightness(1.3);
  }
}

@media (max-width: 768px) {
  .hologram-wrapper {
    height: 300px !important;
  }
  
  .profile-figure.has-tooltip {
    max-width: 300px !important;
  }
}
</style>
