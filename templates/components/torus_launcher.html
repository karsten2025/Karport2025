<!-- 🌀 TORUS LAUNCHER: Die rollende "Symbiotic Value Engine" -->
<div id="torus-launcher-container">
  <div id="torus-launcher" class="torus-orb" aria-label="Open Chat with Value Engine">
    <img 
      src="{{ url_for('static', filename='images/roll-torus-logo.png') }}" 
      alt="The Symbiotic Value Engine"
      class="torus-image"
      loading="lazy"
    />
    <div class="torus-glow"></div>
  </div>
  
  <!-- Tooltip: "Chatrobot" -->
  <div id="torus-tooltip" class="torus-tooltip">Chatrobot</div>
</div>

<style>
/* ============================================================
   TORUS CONTAINER: Fixed Position (bottom-right)
   ============================================================ */
#torus-launcher-container {
  position: fixed;
  bottom: 30px;
  right: 30px;
  z-index: 10000; /* Über Ticker & Ballons */
  pointer-events: none;
}

/* ============================================================
   TORUS ORB: Der rollende Button
   ============================================================ */
.torus-orb {
  position: relative;
  width: 70px;
  height: 70px;
  border-radius: 50%;
  overflow: hidden;
  cursor: pointer;
  pointer-events: auto;
  background: #000;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
  transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
  
  /* CRITICAL: Start-Position LINKS außerhalb, direkt im CSS */
  opacity: 1;
  transform: translateX(calc(-100vw - 200px)) rotate(0deg);
}

/* Torus-Bild: Perfektes Kreisclipping */
.torus-image {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transform: scale(1.1); /* Eliminiert schwarze Ränder */
  mix-blend-mode: screen; /* Macht schwarze Bereiche transparent */
  filter: brightness(1.15) contrast(1.05);
}

/* ============================================================
   GLOW-EFFEKT: Pulsierendes blaues Leuchten
   ============================================================ */
.torus-glow {
  position: absolute;
  top: -10px;
  left: -10px;
  width: calc(100% + 20px);
  height: calc(100% + 20px);
  border-radius: 50%;
  background: radial-gradient(circle, rgba(0, 138, 215, 0.6), transparent 60%);
  opacity: 0;
  transition: opacity 0.5s ease;
  pointer-events: none;
  filter: blur(8px);
}

/* ============================================================
   ZUSTÄNDE: Rolling, Arrived, Hover
   ============================================================ */
.torus-orb.rolling {
  /* Animation wird per JS gesteuert */
  opacity: 1;
}

.torus-orb.arrived {
  opacity: 1;
  animation: torusPulse 3s ease-in-out infinite;
  box-shadow: 
    0 4px 20px rgba(0, 0, 0, 0.3),
    0 0 30px rgba(0, 138, 215, 0.5),
    0 0 60px rgba(0, 138, 215, 0.3);
}

.torus-orb.arrived .torus-glow {
  opacity: 1;
  animation: glowPulse 3s ease-in-out infinite;
}

.torus-orb:hover {
  transform: translateX(0) rotate(0deg) scale(1.12) !important;
  box-shadow: 
    0 8px 30px rgba(0, 0, 0, 0.4),
    0 0 40px rgba(0, 138, 215, 0.7),
    0 0 80px rgba(0, 138, 215, 0.5);
}

/* ============================================================
   ANIMATIONS: Pulse & Glow
   ============================================================ */
@keyframes torusPulse {
  0%, 100% { 
    transform: translateX(0) rotate(0deg) scale(1);
  }
  50% { 
    transform: translateX(0) rotate(0deg) scale(1.08);
  }
}

@keyframes glowPulse {
  0%, 100% { 
    opacity: 0.7;
    filter: blur(8px);
  }
  50% { 
    opacity: 1;
    filter: blur(12px);
  }
}

/* ============================================================
   TOOLTIP: "Chatrobot" beim Hover
   ============================================================ */
.torus-tooltip {
  position: absolute;
  bottom: 85px;
  right: 0;
  padding: 8px 14px;
  background: rgba(20, 20, 30, 0.95);
  color: #ffffff;
  font-size: 13px;
  font-weight: 600;
  border-radius: 8px;
  white-space: nowrap;
  opacity: 0;
  pointer-events: none;
  transform: translateY(5px);
  transition: opacity 0.3s ease, transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
  box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
  backdrop-filter: blur(10px);
  border: 1px solid rgba(0, 138, 215, 0.3);
}

/* Tooltip-Pfeil */
.torus-tooltip::after {
  content: '';
  position: absolute;
  bottom: -6px;
  right: 20px;
  width: 12px;
  height: 12px;
  background: rgba(20, 20, 30, 0.95);
  transform: rotate(45deg);
  border-right: 1px solid rgba(0, 138, 215, 0.3);
  border-bottom: 1px solid rgba(0, 138, 215, 0.3);
}

/* Zeige Tooltip beim Hover */
#torus-launcher-container:hover .torus-tooltip {
  opacity: 1;
  transform: translateY(0);
}

/* ============================================================
   VERSTECKE DEN ALTEN CHAT-BUTTON
   ============================================================ */
#kz-chat-trigger {
  opacity: 0 !important;
  pointer-events: none !important;
  visibility: hidden !important;
}

/* ============================================================
   RESPONSIVE: Mobile Anpassungen
   ============================================================ */
@media (max-width: 768px) {
  #torus-launcher-container {
    bottom: 20px;
    right: 20px;
  }
  
  .torus-orb {
    width: 60px;
    height: 60px;
  }
  
  .torus-tooltip {
    bottom: 75px;
    font-size: 12px;
    padding: 6px 12px;
  }
}
</style>
