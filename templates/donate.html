<!DOCTYPE html>
<html lang="{{ 'de' if lang == 'de' else 'en' }}">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>
      {% if lang == 'de' %} Unterstützung für meine unabhängige Arbeit – Karsten
      Zenk {% else %} Support my independent work – Karsten Zenk {% endif %}
    </title>

    <meta
      name="description"
      content="{% if lang == 'de' %}Freiwillige Unterstützung für die unabhängige Arbeit von Karsten Zenk.{% else %}Voluntary support for the independent work of Karsten Zenk.{% endif %}"
    />

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
  </head>
  <body>
    <!-- Sprachumschalter wie auf der Startseite -->
    <div class="language-switch">
      <a
        href="{{ url_for('donate') }}?lang=de"
        class="lang-button"
        title="Deutsch"
        aria-label="Deutsch"
        >🇩🇪</a
      >
      <a
        href="{{ url_for('donate') }}?lang=en"
        class="lang-button"
        title="English"
        aria-label="English"
        >🇬🇧</a
      >
    </div>

    <main id="preview" aria-label="Spendenbereich">
      <div id="preview-content">
        <div class="project-card" style="max-width: 640px; margin-top: 2rem">
          {% if lang == 'de' %}
            {% include 'partials/donate.de.html' %}
          {% else %}
            {% include 'partials/donate.en.html' %}
          {% endif %}
        </div>
      </div>
    </main>
  </body>
</html>
