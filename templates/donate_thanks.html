<!DOCTYPE html>
<html lang="{{ 'de' if lang == 'de' else 'en' }}">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>
      {% if lang == 'de' %} Vielen Dank für Ihre Unterstützung – Karsten Zenk {%
      else %} Thank you for your support – Karsten Zenk {% endif %}
    </title>

    <meta
      name="description"
      content="{% if lang == 'de' %}Dankesseite für Unterstützerinnen und Unterstützer der Arbeit von Karsten Zenk.{% else %}Thank-you page for people supporting the work of Karsten Zenk.{% endif %}"
    />

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
  </head>
  <body>
    <!-- Sprachumschalter -->
    <div class="language-switch">
      <a
        href="{{ url_for('donate_thanks') }}?lang=de"
        class="lang-button"
        title="Deutsch"
        aria-label="Deutsch"
        >🇩🇪</a
      >
      <a
        href="{{ url_for('donate_thanks') }}?lang=en"
        class="lang-button"
        title="English"
        aria-label="English"
        >🇬🇧</a
      >
    </div>

    <main id="preview" aria-label="Dankesseite">
      <div id="preview-content">
        <div class="project-card" style="max-width: 640px; margin-top: 2rem">
          {% if lang == 'de' %}
            {% include 'partials/donate_thanks.de.html' %}
          {% else %}
            {% include 'partials/donate_thanks.en.html' %}
          {% endif %}
        </div>
      </div>
    </main>
  </body>
</html>
